name: Check PHP source
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Scan secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks dir . --redact=100 --no-banner --ignore-gitleaks-allow
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.3'
            database: mariadb:10.11
          - php: '8.4'
            database: mysql:8.4
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-root-password-2026
          MYSQL_DATABASE: quickotp_test_ci
          MYSQL_USER: qotp_ci
          MYSQL_PASSWORD: synthetic-ci-test-password-2026
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 || mariadb-admin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, openssl, mbstring, iconv, curl, zlib, pcntl, zip, tokenizer
          tools: composer:v2
          coverage: none
      - name: Install and audit dependencies
        run: |
          composer install --working-dir=quickotp-private --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer audit --working-dir=quickotp-private --no-dev
      - name: Lint and test PHP
        env:
          QUICKOTP_TEST_DB_HOST: 127.0.0.1
          QUICKOTP_TEST_DB_PORT: '3306'
          QUICKOTP_TEST_DB_NAME: quickotp_test_ci
          QUICKOTP_TEST_DB_USER: qotp_ci
          QUICKOTP_TEST_DB_PASSWORD: synthetic-ci-test-password-2026
          QUICKOTP_TEST_RESET_DATABASE: '1'
        run: |
          find public_html quickotp-private tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/unit.php
          php tests/updater.php
          python3 tests/maintenance.py
          python3 tests/integration.py
          python3 tools/package.py
          python3 tests/webroot.py
          QUICKOTP_TEST_PACKAGE="$PWD/dist/Quick-Otp-Email-Check-PHP_v$(cat VERSION).zip" python3 tests/integration.py
          QUICKOTP_TEST_PACKAGE="$PWD/dist/Quick-Otp-Email-Check-PHP_v$(cat VERSION)-website.zip" python3 tests/integration.py
