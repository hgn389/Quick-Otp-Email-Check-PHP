<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f6fb"><title>Đổi mật khẩu · Quick OTP Mail</title><link rel="stylesheet" href="/auth.css"><link rel="stylesheet" href="/type-scale.css"></head>
<body><main class="auth-shell"><div class="auth-brand"><span class="brand-mark">✉</span><span>Quick OTP Mail</span></div><section class="auth-card"><h1>Đổi mật khẩu</h1><p>Bạn phải đặt mật khẩu mới trước khi sử dụng Webpanel.</p><div class="message error" id="message" role="alert"></div><form id="passwordForm"><label for="currentPassword">Mật khẩu hiện tại</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required maxlength="72" autofocus><label for="newPassword">Mật khẩu mới</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="72"><div class="password-rules">Tối thiểu 10 ký tự và không được trùng mật khẩu mặc định.</div><label for="confirmPassword">Nhập lại mật khẩu mới</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="72"><button id="submitButton" type="submit">Lưu mật khẩu mới</button></form></section><div class="auth-foot">Phiên đăng nhập cũ sẽ bị thu hồi sau khi đổi mật khẩu.</div></main><script src="/change-password.js" defer></script></body>
</html>
